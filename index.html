<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta
      name="description"
      content="Mapa interactivo de canciones conectadas por sonido, época, escena e influencia."
    />
    <title>Constelación sonora</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#network">Saltar a la red</a>

    <main class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Constelación sonora">
          <span class="brand-mark" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
          <div>
            <p class="eyebrow">MAPA MUSICAL</p>
            <h1>Constelación sonora</h1>
          </div>
        </div>

        <div class="topbar-actions">
          <label class="search-field" for="search">
            <span class="sr-only">Buscar canción o artista</span>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m21 21-4.35-4.35m2.35-5.15A7.5 7.5 0 1 1 4 11.5a7.5 7.5 0 0 1 15 0Z" />
            </svg>
            <input id="search" type="search" autocomplete="off" placeholder="Canción, artista o álbum…" />
          </label>
          <button id="resetView" class="ghost-button" type="button" title="Recentrar red">
            Recentrar
          </button>
        </div>
      </header>

      <section class="workspace">
        <section class="graph-card" aria-label="Red de canciones">
          <div class="graph-toolbar">
            <div id="genreFilters" class="filter-list" aria-label="Filtrar por género"></div>
            <p id="resultCount" class="result-count" aria-live="polite"></p>
          </div>

          <div id="network" class="network" tabindex="0">
            <svg id="graph" role="img" aria-labelledby="graphTitle graphDesc">
              <title id="graphTitle">Red interactiva de canciones</title>
              <desc id="graphDesc">Las líneas unen canciones relacionadas. Selecciona un nodo para conocer sus conexiones.</desc>
              <g id="viewport">
                <g id="links"></g>
                <g id="nodes"></g>
              </g>
            </svg>
            <div class="zoom-controls" aria-label="Controles de zoom">
              <button id="zoomIn" type="button" aria-label="Acercar">+</button>
              <button id="zoomOut" type="button" aria-label="Alejar">−</button>
            </div>
            <div id="emptyState" class="empty-state" hidden>
              <span>Sin coincidencias</span>
              <p>Prueba otro nombre o cambia el filtro.</p>
            </div>
          </div>

          <footer class="graph-footer">
            <div id="legend" class="legend"></div>
            <p>Arrastra nodos · Desplaza el fondo · Usa la rueda para acercar</p>
          </footer>
        </section>

        <aside id="details" class="details-card" aria-live="polite">
          <div class="details-empty">
            <div class="pulse-orbit" aria-hidden="true"><span></span></div>
            <p class="eyebrow">EXPLORA LA RED</p>
            <h2>Elige una canción</h2>
            <p>Descubre por qué está conectada con las demás y sigue cada enlace en Spotify.</p>
          </div>
        </aside>
      </section>
    </main>

    <template id="detailsTemplate">
      <article class="song-details">
        <div class="song-kicker">
          <span class="song-dot"></span>
          <span class="song-genre"></span>
        </div>
        <h2 class="song-title"></h2>
        <p class="song-artist"></p>
        <dl class="metadata">
          <div><dt>Álbum</dt><dd class="song-album"></dd></div>
          <div><dt>Año</dt><dd class="song-year"></dd></div>
        </dl>
        <a class="spotify-button" target="_blank" rel="noreferrer">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm4.58 14.42a.62.62 0 0 1-.86.2c-2.36-1.44-5.33-1.77-8.83-.97a.625.625 0 1 1-.28-1.22c3.83-.87 7.12-.5 9.77 1.12.3.18.39.57.2.87Zm1.23-2.73a.78.78 0 0 1-1.08.26c-2.7-1.66-6.82-2.14-10.01-1.17a.78.78 0 1 1-.46-1.5c3.65-1.1 8.19-.57 11.3 1.34.37.23.48.71.25 1.07Zm.1-2.84C14.67 8.93 9.34 8.75 6.25 9.69a.94.94 0 1 1-.54-1.79c3.55-1.08 9.44-.87 13.16 1.34a.94.94 0 0 1-.96 1.61Z" /></svg>
          Abrir en Spotify
        </a>
        <section class="connections-section">
          <div class="section-heading">
            <h3>Conexiones</h3>
            <span class="connection-count"></span>
          </div>
          <div class="connection-list"></div>
        </section>
      </article>
    </template>

    <script src="app.js" defer></script>
  </body>
</html>
